# This workflow is triggered when code is pushed to the main branch
# It performs the following steps:
# 1. Checks out the code.
    # -> uses: actions/checkout@v2

# 2. Logs into Docker Hub.
    # -> uses: docker/login-action@v2
      #  with: username and password
    
# 3. Builds a Docker image.
    # -> uses: docker/build-push-action@v2

# 4. Pushes the image to Docker Hub.
    # -> uses: docker/build-push-action@v2

# 5. Deploys the image to a VM by:
#    a. SSHing into the machine.
#    b. Stopping the existing container.
#    c. Running the new container.

name: Deploy backend of the application

on: 
  push:
    branches: [main]

jobs:
  deploy_backend:
    runs-on: ubuntu-latest

    concurrency:
      group: backend
      cancel-in-progress: true

    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USEREMAIL }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      - name: Build and push to docker hub
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: sartajashraf/monorepo-backend-cicd-docker-nginx:${{ github.sha }}

      - name: SSH and Deploy to VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh -i ~/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_HOST_USER }}@${{ secrets.SSH_HOST_IP }} -t "docker run -d --name user_backend -p 8080:8080 sartajashraf/monorepo-backend-cicd-docker-nginx:${{ github.sha }}"
  
  deploy_ws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USEREMAIL }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push 
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.ws
          push: true
          tags: sartajashraf/monorepo-ws-cicd-docker-nginx:${{ github.sha }}
      - name: Deploy to the VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          chmod 700 ~/ssh_key
          ssh -i ~/ssh_key -o StrictHostKeyChecking=no ${{ secrets.SSH_HOST_USER }}@${{ secrets.SSH_HOST_IP }} -t "docker run --name ws_backend -d -p 8081:8081 sartajashraf/monorepo-ws-cicd-docker-nginx:${{ github.sha }}"